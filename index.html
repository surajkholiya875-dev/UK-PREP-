      rel="stylesheet"
    />
    <script>
      try {
        var storedTheme = window.localStorage.getItem('ukprep_study_theme');
        if (storedTheme !== 'light') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
